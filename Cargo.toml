[package]
name = "tagvault"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Industrial time-series historian: Sparkplug B ingest, swinging-door compression, Gorilla chunks, crash-safe WAL, store-and-forward, query engine"
license = "MIT"
readme = "README.md"
publish = false

[lib]
name = "tagvault"
path = "src/lib.rs"

[[bin]]
name = "tagvault"
path = "src/main.rs"

[dependencies]
prost = "=0.14.4"
crc32fast = "=1.5.0"
thiserror = "=2.0.18"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
clap = { version = "=4.5.20", features = ["derive"] }
log = "=0.4.27"
env_logger = { version = "=0.11.5", default-features = false, features = ["auto-color", "humantime"] }
tiny_http = "=0.12.0"

[dev-dependencies]
proptest = { version = "=1.5.0", default-features = false, features = ["std"] }
tempfile = "=3.13.0"

[profile.release]
debug = false
